<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Advanced Search</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="advanced-page">
  <header class="advanced-header">
    <a class="mini-wordmark" href="index.html" aria-label="Google Search">Google</a>
    <a class="back-link" href="index.html">Google Search</a>
  </header>
  <main class="advanced-main">
    <h1>Advanced Search</h1>
    <div class="section-rule"></div>
    <h2>Find pages with…</h2>
    <form action="https://www.google.com/search" method="get" class="advanced-form">
      <div class="advanced-row"><label for="all-words">all these words:</label><input id="all-words" type="text" name="as_q"></div>
      <div class="advanced-row"><label for="exact-phrase">this exact word or phrase:</label><input id="exact-phrase" type="text" name="as_epq"></div>
      <div class="advanced-row"><label for="any-words">any of these words:</label><input id="any-words" type="text" name="as_oq"></div>
      <div class="advanced-row"><label for="none-words">none of these words:</label><input id="none-words" type="text" name="as_eq"></div>
      <div class="advanced-submit-row"><button type="submit">Advanced Search</button></div>
    </form>
    <p class="citation-note"><a class="citation-link" href="https://github.com/gregorfilip/googlesearch/blob/main/README.md">Citace</a></p>
  </main>
</body>
</html>
