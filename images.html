<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Google Image Search</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page">
  <nav class="top-nav" aria-label="Main navigation">
    <a href="index.html">Google Search</a>
    <a href="advanced.html">Advanced Search</a>
  </nav>
  <main class="home-main">
    <div class="wordmark" role="img" aria-label="Google Images"><span class="blue">G</span><span class="red">o</span><span class="yellow">o</span><span class="blue">g</span><span class="green">l</span><span class="red">e</span><span class="image-label">Images</span></div>
    <form class="search-form" action="https://www.google.com/search" method="get">
      <input type="hidden" name="tbm" value="isch">
      <label class="visually-hidden" for="image-query">Search images</label>
      <div class="search-box">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"></circle><path d="m16 16 5 5"></path></svg>
        <input id="image-query" type="text" name="q" autocomplete="off" autofocus>
      </div>
      <div class="search-actions"><input type="submit" value="Google Image Search"></div>
    </form>
  </main>
  <footer class="footer"><span>Made for CS50 Web — Project 0</span><a class="citation-link" href="https://github.com/gregorfilip/googlesearch/blob/main/README.md">Citace</a><p><a href="https://gregorfilip.github.io/googlesearch/"><img style="border:0;width:88px;height:31px" src="https://jigsaw.w3.org/css-validator/images/vcss-blue" alt="Ověřit CSS!"></a></p></footer>
</body>
</html>
